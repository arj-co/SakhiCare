version: '3.8'

services:
  sakhicare-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakhicare-care-desk
    ports:
      - "8000:8000"
    environment:
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID:-sakhicare-app-id-placeholder}
      - ONESIGNAL_REST_API_KEY=${ONESIGNAL_REST_API_KEY:-}
      - APP_ENV=${APP_ENV:-development}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-supabase}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-sakhicare-audio}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5175}
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
